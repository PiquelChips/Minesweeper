[package]
name = "minesweeper"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
rand = "0.10.4"
thiserror = "2.0.21"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Modules with children live in `foo/mod.rs`, not `foo.rs` next to `foo/`.
self_named_module_files = "warn"
